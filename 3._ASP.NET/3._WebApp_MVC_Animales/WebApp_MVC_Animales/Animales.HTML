<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Animales</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .animal-id {
            font-weight: bold;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <h1>Lista de Animales</h1>
    <ul>
        <li><span class="animal-id">ID: 1</span>Elefante</li>
        <li><span class="animal-id">ID: 2</span>Tigre</li>
        <li><span class="animal-id">ID: 3</span>León</li>
        <li><span class="animal-id">ID: 4</span>Jirafa</li>
        <li><span class="animal-id">ID: 5</span>Rinoceronte</li>
        <li><span class="animal-id">ID: 6</span>Oso Panda</li>
        <li><span class="animal-id">ID: 7</span>Koala</li>
        <li><span class="animal-id">ID: 8</span>Cephalopodo</li>
        <li><span class="animal-id">ID: 9</span>Canguro</li>
        <li><span class="animal-id">ID: 10</span>Águila</li>
    </ul>
</body>
</html>
